openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: Production-grade REST API with JWT auth and role-based task management.

servers:
  - url: http://localhost:5000/api/v1
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Tasks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Shared ────────────────────────────────────────────────
    Error:
      type: object
      properties:
        status:  { type: string, example: error }
        message: { type: string }

    ValidationError:
      type: object
      properties:
        status:  { type: string, example: error }
        message: { type: string, example: Validation failed }
        errors:
          type: array
          items:
            type: object
            properties:
              field:   { type: string }
              message: { type: string }

    # ── Auth ──────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, example: user@example.com }
        password: { type: string, minLength: 8,  example: Secret123 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, example: user@example.com }
        password: { type: string, example: Secret123 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthUser:
      type: object
      properties:
        id:        { type: string, example: clxyz123 }
        email:     { type: string, example: user@example.com }
        role:      { type: string, enum: [USER, ADMIN] }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            user:         { $ref: "#/components/schemas/AuthUser" }
            accessToken:  { type: string }
            refreshToken: { type: string }

    TokensResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            accessToken:  { type: string }
            refreshToken: { type: string }

    # ── Task ──────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id:          { type: string, example: clxyz456 }
        title:       { type: string, example: Write tests }
        description: { type: string, example: Cover all service methods, nullable: true }
        completed:   { type: boolean, example: false }
        userId:      { type: string, example: clxyz123 }
        createdAt:   { type: string, format: date-time }
        user:
          type: object
          properties:
            id:    { type: string }
            email: { type: string }

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:       { type: string, maxLength: 255, example: Write tests }
        description: { type: string, maxLength: 1000, example: Cover all service methods }

    UpdateTaskRequest:
      type: object
      properties:
        title:       { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        completed:   { type: boolean }

    PaginatedTasks:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            tasks:
              type: array
              items: { $ref: "#/components/schemas/Task" }
            meta:
              type: object
              properties:
                total:      { type: integer, example: 42 }
                page:       { type: integer, example: 1 }
                limit:      { type: integer, example: 10 }
                totalPages: { type: integer, example: 5 }

    TaskResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:   { $ref: "#/components/schemas/Task" }

# ── Paths ─────────────────────────────────────────────────────
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  # ── Auth ────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensResponse" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Tasks ───────────────────────────────────────────────────
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks (paginated)
      description: USER sees own tasks. ADMIN sees all tasks.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 100 }
        - in: query
          name: completed
          schema: { type: string, enum: [true, false] }
      responses:
        "200":
          description: Paginated task list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTasks" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      tags: [Tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Task ID

    get:
      tags: [Tasks]
      summary: Get a task by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Task not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      tags: [Tasks]
      summary: Update a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Task not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [Tasks]
      summary: Delete a task
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Task deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Task not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }